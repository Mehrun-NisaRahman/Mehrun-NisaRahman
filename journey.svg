      <text x="892" y="138" font-size="13" font-weight="700" fill="#2fa37a">JavaScript</text>
      <line x1="892" y1="148" x2="1108" y2="148" stroke="#B5EAD7" stroke-width="2"/><text x="892" y="168" font-size="13" fill="#475569">Team platform for booking local</text><text x="892" y="187" font-size="13" fill="#475569">home services and tracking job</text><text x="892" y="206" font-size="13" fill="#475569">status in real time.</text><line x1="178.0" y1="254" x2="178.0" y2="330" stroke="#B8E0FF" stroke-width="3" stroke-linecap="round"/><circle cx="178.0" cy="330" r="5" fill="#3b8fd9"/><rect x="94.0" y="262" width="168" height="26" rx="13" fill="#B8E0FF"/><text x="178.0" y="280" text-anchor="middle" font-size="12" font-weight="800" fill="#3B2F63">structured data</text><line x1="452.0" y1="254" x2="452.0" y2="330" stroke="#C7B8F5" stroke-width="3" stroke-linecap="round"/><circle cx="452.0" cy="330" r="5" fill="#7c6be0"/><rect x="368.0" y="262" width="168" height="26" rx="13" fill="#C7B8F5"/><text x="452.0" y="280" text-anchor="middle" font-size="12" font-weight="800" fill="#3B2F63">careful evaluation</text><line x1="726.0" y1="254" x2="726.0" y2="330" stroke="#F9B8D6" stroke-width="3" stroke-linecap="round"/><circle cx="726.0" cy="330" r="5" fill="#d9559b"/><rect x="642.0" y="262" width="168" height="26" rx="13" fill="#F9B8D6"/><text x="726.0" y="280" text-anchor="middle" font-size="12" font-weight="800" fill="#3B2F63">visual computing</text><line x1="1000.0" y1="254" x2="1000.0" y2="330" stroke="#B5EAD7" stroke-width="3" stroke-linecap="round"/><circle cx="1000.0" cy="330" r="5" fill="#2fa37a"/><rect x="916.0" y="262" width="168" height="26" rx="13" fill="#B5EAD7"/><text x="1000.0" y="280" text-anchor="middle" font-size="12" font-weight="800" fill="#3B2F63">teamwork and real users</text>
