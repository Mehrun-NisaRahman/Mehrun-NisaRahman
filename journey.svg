      <text x="118" y="76" font-size="11" font-weight="800" fill="#3b8fd9" letter-spacing="0.8">DATABASES</text><text x="118" y="95" font-size="15" font-weight="800" fill="#3B2F63">Online Inventory &amp;</text><text x="118" y="113" font-size="15" font-weight="800" fill="#3B2F63">Order Management</text>
      <text x="70" y="138" font-size="13" font-weight="700" fill="#3b8fd9">PHP · MySQL</text>
      <line x1="70" y1="148" x2="286" y2="148" stroke="#B8E0FF" stroke-width="2"/><text x="70" y="168" font-size="13" fill="#475569">Buyer/seller marketplace with a</text><text x="70" y="187" font-size="13" fill="#475569">cart, payments, and a quiz-</text><text x="70" y="206" font-size="13" fill="#475569">based discount engine on an</text><text x="70" y="225" font-size="13" fill="#475569">11-table schema.</text><g filter="url(#shadow)"><rect x="326" y="40" width="252" height="214" rx="18" fill="#fff"/></g>
      <rect x="326" y="40" width="252" height="214" rx="18" fill="none" stroke="#C7B8F5" stroke-width="2"/>
