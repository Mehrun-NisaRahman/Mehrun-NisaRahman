    <line x1="178.0" y1="254" x2="178.0" y2="330" stroke="#22d3ee" stroke-width="2"/><circle cx="178.0" cy="330" r="4" fill="#22d3ee"/><rect x="94.0" y="262" width="168" height="24" rx="12" fill="#0b1020" stroke="#22d3ee" stroke-opacity="0.6"/><text x="178.0" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="#22d3ee">structured data</text><line x1="452.0" y1="254" x2="452.0" y2="330" stroke="#a78bfa" stroke-width="2"/><circle cx="452.0" cy="330" r="4" fill="#a78bfa"/><rect x="368.0" y="262" width="168" height="24" rx="12" fill="#0b1020" stroke="#a78bfa" stroke-opacity="0.6"/><text x="452.0" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="#a78bfa">careful evaluation</text><line x1="726.0" y1="254" x2="726.0" y2="330" stroke="#f472b6" stroke-width="2"/><circle cx="726.0" cy="330" r="4" fill="#f472b6"/><rect x="642.0" y="262" width="168" height="24" rx="12" fill="#0b1020" stroke="#f472b6" stroke-opacity="0.6"/><text x="726.0" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="#f472b6">visual computing</text><line x1="1000.0" y1="254" x2="1000.0" y2="330" stroke="#34d399" stroke-width="2"/><circle cx="1000.0" cy="330" r="4" fill="#34d399"/><rect x="916.0" y="262" width="168" height="24" rx="12" fill="#0b1020" stroke="#34d399" stroke-opacity="0.6"/><text x="1000.0" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="#34d399">teamwork and real users</text>
