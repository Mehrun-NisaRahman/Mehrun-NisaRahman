<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Four course projects (databases, AI, graphics, software engineering) feeding into a human-in-the-loop multi-agent vision-language thesis.">
