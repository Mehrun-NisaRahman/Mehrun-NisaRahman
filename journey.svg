      <text x="618" y="138" font-size="13" font-weight="700" fill="#d9559b">Python · PyOpenGL</text>
      <line x1="618" y1="148" x2="834" y2="148" stroke="#F9B8D6" stroke-width="2"/><text x="618" y="168" font-size="13" fill="#475569">3D endless-runner game with</text><text x="618" y="187" font-size="13" fill="#475569">lanes, pickups, a day/night</text><text x="618" y="206" font-size="13" fill="#475569">cycle, and two camera views.</text><g filter="url(#shadow)"><rect x="874" y="40" width="252" height="214" rx="18" fill="#fff"/></g>
      <rect x="874" y="40" width="252" height="214" rx="18" fill="none" stroke="#B5EAD7" stroke-width="2"/>
