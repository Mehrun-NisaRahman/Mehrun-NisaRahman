  <text x="156" y="366" font-size="12" font-weight="700" fill="#f59e0b" letter-spacing="1">B.SC. THESIS</text>
  <text x="156" y="390" font-size="19" font-weight="700" fill="#fff">Human-in-the-Loop Multi-Agent Vision-Language Framework</text>
  <text x="156" y="412" font-size="14" fill="#a5b4fc">for qualitative coding: more accurate and explainable than a single-agent VLM</text>
