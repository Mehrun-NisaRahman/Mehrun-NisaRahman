<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Databases, machine learning, graphics and software engineering projects feeding into a human-in-the-loop multi-agent vision-language thesis.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF5FA"/><stop offset="0.5" stop-color="#F3EFFF"/><stop offset="1" stop-color="#E9F6FF"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B8E0FF"/><stop offset="0.35" stop-color="#C7B8F5"/><stop offset="0.7" stop-color="#F9B8D6"/><stop offset="1" stop-color="#B5EAD7"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#C7B8F5" fill-opacity="0.35"/></pattern>
