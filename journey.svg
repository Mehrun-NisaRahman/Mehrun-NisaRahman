      <circle cx="910" cy="84" r="19" fill="#B5EAD7"/>
      <g transform="translate(910,84)"><text x="0" y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#2fa37a">&lt;/&gt;</text></g>
