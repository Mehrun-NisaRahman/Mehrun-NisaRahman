      <rect x="326" y="40" width="252" height="8" rx="4" fill="#C7B8F5"/>
      <circle cx="362" cy="84" r="19" fill="#C7B8F5"/>
      <g transform="translate(362,84)"><g stroke="#7c6be0" stroke-width="1.6" fill="#7c6be0"><line x1="-6" y1="-5" x2="6" y2="-5"/><line x1="-6" y1="-5" x2="0" y2="6"/><line x1="6" y1="-5" x2="0" y2="6"/><circle cx="-6" cy="-5" r="2.5"/><circle cx="6" cy="-5" r="2.5"/><circle cx="0" cy="6" r="2.5"/></g></g>
      <text x="392" y="76" font-size="11" font-weight="800" fill="#7c6be0" letter-spacing="0.8">MACHINE LEARNING</text><text x="392" y="95" font-size="15" font-weight="800" fill="#3B2F63">Hotel Booking Status</text><text x="392" y="113" font-size="15" font-weight="800" fill="#3B2F63">Classification</text>
