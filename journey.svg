      <text x="118" y="78" font-size="12" font-weight="700" fill="#22d3ee" letter-spacing="1">CSE370</text>
      <text x="118" y="97" font-size="16" font-weight="700" fill="#fff">Databases</text>
      <text x="70" y="138" font-size="13" font-weight="600" fill="#22d3ee">PHP · MySQL</text>
      <line x1="70" y1="148" x2="286" y2="148" stroke="#fff" stroke-opacity="0.1"/>
      <text x="70" y="168" font-size="13" fill="#cbd5e1">Buyer/seller marketplace with a</text><text x="70" y="187" font-size="13" fill="#cbd5e1">cart, payments, and a quiz-</text><text x="70" y="206" font-size="13" fill="#cbd5e1">based discount engine on an</text><text x="70" y="225" font-size="13" fill="#cbd5e1">11-table schema.</text>
    </g><g>
      <rect x="326" y="40" width="252" height="214" rx="16" fill="#111633" stroke="#a78bfa" stroke-opacity="0.55"/>
