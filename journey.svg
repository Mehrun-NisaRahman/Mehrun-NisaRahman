      <line x1="344" y1="148" x2="560" y2="148" stroke="#C7B8F5" stroke-width="2"/><text x="344" y="168" font-size="13" fill="#475569">119K bookings, 4 models, 83%</text><text x="344" y="187" font-size="13" fill="#475569">accuracy, 0.91 AUC, with</text><text x="344" y="206" font-size="13" fill="#475569">leakage and class imbalance</text><text x="344" y="225" font-size="13" fill="#475569">handled.</text><g filter="url(#shadow)"><rect x="600" y="40" width="252" height="214" rx="18" fill="#fff"/></g>
