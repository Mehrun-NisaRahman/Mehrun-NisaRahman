<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Roles I am looking for: AI and machine learning, software engineering, and research assistant.">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B8E0FF"/><stop offset="0.35" stop-color="#C7B8F5"/><stop offset="0.7" stop-color="#F9B8D6"/><stop offset="1" stop-color="#B5EAD7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#8b7fc7" flood-opacity="0.22"/></filter>
    
  </defs>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif"><g filter="url(#shadow)"><rect x="20" y="10" width="368" height="160" rx="22" fill="#fff"/></g><rect x="20" y="10" width="368" height="160" rx="22" fill="none" stroke="#C7B8F5" stroke-width="3"/><rect x="20" y="10" width="368" height="160" rx="22" fill="#C7B8F5" fill-opacity="0.18"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4s" begin="0.0s" repeatCount="indefinite"/><circle cx="70" cy="62" r="28" fill="#C7B8F5"/><g transform="translate(70,62) scale(1.4)"><g stroke="#7c6be0" stroke-width="1.6" fill="#7c6be0"><line x1="-6" y1="-5" x2="6" y2="-5"/><line x1="-6" y1="-5" x2="0" y2="6"/><line x1="6" y1="-5" x2="0" y2="6"/><circle cx="-6" cy="-5" r="2.5"/><circle cx="6" cy="-5" r="2.5"/><circle cx="0" cy="6" r="2.5"/></g></g></g><text x="114" y="56" font-size="11" font-weight="800" fill="#7c6be0" letter-spacing="1.5">LOOKING FOR</text><text x="114" y="80" font-size="21" font-weight="800" fill="#3B2F63">AI / Machine Learning</text><text x="48" y="124" font-size="14.5" fill="#475569">Data preparation, model training, and</text><text x="48" y="145" font-size="14.5" fill="#475569">fair evaluation on imbalanced data.</text><g filter="url(#shadow)"><rect x="416" y="10" width="368" height="160" rx="22" fill="#fff"/></g><rect x="416" y="10" width="368" height="160" rx="22" fill="none" stroke="#B8E0FF" stroke-width="3"/><rect x="416" y="10" width="368" height="160" rx="22" fill="#B8E0FF" fill-opacity="0.18"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4s" begin="0.6s" repeatCount="indefinite"/><circle cx="466" cy="62" r="28" fill="#B8E0FF"/><g transform="translate(466,62) scale(1.4)"><text x="0" y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#3b8fd9">&lt;/&gt;</text></g></g><text x="510" y="56" font-size="11" font-weight="800" fill="#3b8fd9" letter-spacing="1.5">LOOKING FOR</text><text x="510" y="80" font-size="21" font-weight="800" fill="#3B2F63">Software Engineering</text><text x="444" y="124" font-size="14.5" fill="#475569">Full-stack features, relational database</text><text x="444" y="145" font-size="14.5" fill="#475569">design, and working well in a team.</text><g filter="url(#shadow)"><rect x="812" y="10" width="368" height="160" rx="22" fill="#fff"/></g><rect x="812" y="10" width="368" height="160" rx="22" fill="none" stroke="#B5EAD7" stroke-width="3"/><rect x="812" y="10" width="368" height="160" rx="22" fill="#B5EAD7" fill-opacity="0.18"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4s" begin="1.2s" repeatCount="indefinite"/><circle cx="862" cy="62" r="28" fill="#B5EAD7"/><g transform="translate(862,62) scale(1.4)"><g><path d="M-9,0 Q0,-8 9,0 Q0,8 -9,0 Z" fill="none" stroke="#2fa37a" stroke-width="1.8"/><circle r="2.8" fill="#2fa37a"/></g></g></g><text x="906" y="56" font-size="11" font-weight="800" fill="#2fa37a" letter-spacing="1.5">LOOKING FOR</text><text x="906" y="80" font-size="21" font-weight="800" fill="#3B2F63">Research Assistant</text><text x="840" y="124" font-size="14.5" fill="#475569">Multimodal AI, vision-language models,</text><text x="840" y="145" font-size="14.5" fill="#475569">and human-AI collaboration.</text>
  </g>
</svg>
