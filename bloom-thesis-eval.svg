 Q-16.5,-3.1 -33.1,13.0" stroke="#FFD66B" stroke-width="1.6" fill="none" stroke-opacity="0.9"/><circle cx="-33.1" cy="13.0" r="3" fill="#FFD66B"/><path d="M0,0 Q-10.2,-15.2 -35.4,-15.7" stroke="#FFD66B" stroke-width="1.6" fill="none" stroke-opacity="0.9"/><circle cx="-35.4" cy="-15.7" r="3" fill="#FFD66B"/><path d="M0,0 Q0.7,-22.7 -24.2,-41.6" stroke="#FFD66B" stroke-width="1.6" fill="none" stroke-opacity="0.9"/><circle cx="-24.2" cy="-41.6" r="3" fill="#FFD66B"/><path d="M0,0 Q9.7,-13.0 2.9,-34.3" stroke="#FFD66B" stroke-width="1.6" fill="none" stroke-opacity="0.9"/><circle cx="2.9" cy="-34.3" r="3" fill="#FFD66B"/><path d="M0,0 Q20.4,-5.1 31.0,-32.1" stroke="#FFD66B" stroke-width="1.6" fill="none" stroke-opacity="0.9"/><circle cx="31.0" cy="-32.1" r="3" fill="#FFD66B"/></g></g><rect x="1" y="1" width="286" height="184" rx="20" fill="#FBDCE8" fill-opacity="1" stroke="#2E3A8C" stroke-opacity="0.3" stroke-width="1.6"/><circle cx="36" cy="50" r="17" fill="#FFFFFF" fill-opacity="0.8" stroke="#2E3A8C" stroke-opacity="0.35" stroke-width="1.5"/><text x="36" y="56" font-size="14" font-weight="800" fill="#2E3A8C" fill-opacity="1" text-anchor="middle" letter-spacing="0">01</text><text x="62" y="56" font-size="18" font-weight="800" fill="#2E3A8C" fill-opacity="1" text-anchor="start" letter-spacing="0">Fair comparison</text><text x="22" y="102" font-size="14" font-weight="500" fill="#2E3A8C" fill-opacity="0.9" text-anchor="start" letter-spacing="0">Tested against a single AI</text><text x="22" y="125" font-size="14" font-weight="500" fill="#2E3A8C" fill-opacity="0.9" text-anchor="start" letter-spacing="0">model with the same budget,</text><text x="22" y="148" font-size="14" font-weight="500" fill="#2E3A8C" fill-opacity="0.9" text-anchor="start" letter-spacing="0">plus a simple baseline.</text><rect x="307" y="1" width="286" height="184" rx="20" fill="#DDE2FA" fill-opacity="1" stroke="#2E3A8C" stroke-opacity="0.3" stroke-width="1.6"/><circle cx="342" cy="50" r="17" fill="#FFFFFF" fill-opacity="0.8" stroke="#2E3A8C" stroke-opacity="0.35" stroke-width="1.5"/><text x="342" y="56" font-size="14" font-weight="800" fill="#2E3A8C" fill-opacity="1" text-anchor="middle" letter-spacing="0">02</text><text x="368" y="56" font-size="18" font-weight="800" fill="#2E3A8C" fill-opacity="1" text-anchor="start" letter-spacing="0">Agrees with humans</text><text x="328" y="102" font-size="14" font-weight="500" fill="#2E3A8C" fill-opacity="0.9" text-anchor="start" letter-spacing="0">Scored against human coders</text><text x="328" y="125" font-size="14" font-weight="500" fill="#2E3A8C" fill-opacity="0.9" text-anchor="start" letter-spacing="0">with Cohen's κ,</text><text x="328" y="148" font-size="14" font-weight="500" fill="#2E3A8C" fill-opacity="0.9" text-anchor="start" letter-spacing="0">Krippendorff's α and F1.</text><rect x="613" y="1" width="286" height="184" rx="20" fill="#FFF1C4" fill-opacity="1" stroke="#2E3A8C" stroke-opacity="0.3" stroke-width="1.6"/><circle cx="648" cy="50" r="17" fill="#FFFFFF" fill-opacity="0.8" stroke="#2E3A8C" stroke-opacity="0.35" stroke-width="1.5"/><text x="648" y="56" font-size="14" font-weight="800" fill="#2E3A8C" fill-opacity="1" text-anchor="middle" letter-spacing="0">03</text><text x="674" y="56" font-size="18" font-weight="800" fill="#2E3A8C" fill-opacity="1" text-anchor="start" letter-spacing="0">Clear explanations</text><text x="634" y="102" font-size="14" font-weight="500" fill="#2E3A8C" fill-opacity="0.9" text-anchor="start" letter-spacing="0">Experts rate the</text><text x="634" y="125" font-size="14" font-weight="500" fill="#2E3A8C" fill-opacity="0.9" text-anchor="start" letter-spacing="0">explanations. Speed, cost and</text><text x="634" y="148" font-size="14" font-weight="500" fill="#2E3A8C" fill-opacity="0.9" text-anchor="start" letter-spacing="0">usability (SUS) are measured.</text><rect x="919" y="1" width="286" height="184" rx="20" fill="#FBDCE8" fill-opacity="1" stroke="#2E3A8C" stroke-opacity="0.3" stroke-width="1.6"/><circle cx="954" cy="50" r="17" fill="#FFFFFF" fill-opacity="0.8" stroke="#2E3A8C" stroke-opacity="0.35" stroke-width="1.5"/><text x="954" y="56" font-size="14" font-weight="800" fill="#2E3A8C" fill-opacity="1" text-anchor="middle" letter-spacing="0">04</text><text x="980" y="56" font-size="18" font-weight="800" fill="#2E3A8C" fill-opacity="1" text-anchor="start" letter-spacing="0">Ethics &amp; ablations</text><text x="940" y="102" font-size="14" font-weight="500" fill="#2E3A8C" fill-opacity="0.9" text-anchor="start" letter-spacing="0">Test which parts matter.</text><text x="940" y="125" font-size="14" font-weight="500" fill="#2E3A8C" fill-opacity="0.9" text-anchor="start" letter-spacing="0">Check for bias and over-trust</text><text x="940" y="148" font-size="14" font-weight="500" fill="#2E3A8C" fill-opacity="0.9" text-anchor="start" letter-spacing="0">in AI.</text>
