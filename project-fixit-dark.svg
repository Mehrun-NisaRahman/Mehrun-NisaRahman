<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="1" y="1" width="518" height="298" rx="16" fill="#1A1D2E" stroke="#363A5C" stroke-width="2"/><rect x="24" y="22" width="4" height="16" rx="2" fill="#8FE0C4"/><text x="36" y="35" font-size="13" font-weight="800" fill="#8FE0C4" text-anchor="start" letter-spacing="1.4" >SOFTWARE ENGINEERING</text><text x="24" y="68" font-size="22" font-weight="700" fill="#ECEEFA" text-anchor="start" >FixIt</text><text x="24" y="94" font-size="15.5" font-weight="400" fill="#B4B9D6" text-anchor="start" >Team platform for booking local electricians, plumbers, and</text><text x="24" y="115" font-size="15.5" font-weight="400" fill="#B4B9D6" text-anchor="start" >cleaners and tracking job status.</text><rect x="24" y="130" width="472" height="118" rx="12" fill="#1B3B3A"/><circle cx="84" cy="154" r="16" fill="#14172A" stroke="#8FE0C4" stroke-width="1.5"/><g transform="translate(84,154)"><path d="M2,-9 L-5,2 H0 L-2,9 L6,-3 H1 Z" fill="#8FE0C4"/></g><text x="84" y="188" font-size="13.5" font-weight="600" fill="#ECEEFA" text-anchor="middle" >Electrician</text><circle cx="202" cy="154" r="16" fill="#14172A" stroke="#8FE0C4" stroke-width="1.5"/><g transform="translate(202,154)"><path d="M0,-9 C6,-1 8,3 0,9 C-8,3 -6,-1 0,-9 Z" fill="#8FE0C4"/></g><text x="202" y="188" font-size="13.5" font-weight="600" fill="#ECEEFA" text-anchor="middle" >Plumber</text><circle cx="320" cy="154" r="16" fill="#14172A" stroke="#8FE0C4" stroke-width="1.5"/><g transform="translate(320,154)"><path d="M0,-10 C2,-3 3,-2 10,0 C3,2 2,3 0,10 C-2,3 -3,2 -10,0 C-3,-2 -2,-3 0,-10 Z" fill="#8FE0C4" transform="scale(0.95)"/></g><text x="320" y="188" font-size="13.5" font-weight="600" fill="#ECEEFA" text-anchor="middle" >Cleaner</text><circle cx="438" cy="154" r="16" fill="#14172A" stroke="#8FE0C4" stroke-width="1.5"/><g transform="translate(438,154)"><path d="M0,-9V9 M-8,-4.5L8,4.5 M-8,4.5L8,-4.5" stroke="#8FE0C4" stroke-width="2" stroke-linecap="round