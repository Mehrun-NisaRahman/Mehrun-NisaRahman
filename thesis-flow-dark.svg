<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 364" width="1200" height="364" role="img" aria-label="Thesis pipeline: text and images are preprocessed and coded by AI agents, a human reviews the codes, then cross-modal reasoning and theme extraction follow, a human reviews the themes, and the system validates, explains and reports. Rejected or edited items loop back to the agent.">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#B4B9D6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="22" y="50" width="196" height="74" rx="37" fill="#1B3B3A" stroke="#8FE0C4" stroke-width="2" stroke-dasharray="0"/><text x="120.0" y="93.0" font-size="19" font-weight="700" fill="#ECEEFA" text-anchor="middle" >Text + images</text><rect x="262" y="50" width="196" height="74" rx="12" fill="#2B2852" stroke="#B9A8F7" stroke-width="2" stroke-dasharray="0"/><text x="360.0" y="93.0" font-size="19" font-weight="700" fill="#ECEEFA" text-anchor="middle" >Preprocess</text><rect x="502" y="50" width="196" height="74" rx="12" fill="#2B2852" stroke="#B9A8F7" stroke-width="2" stroke-dasharray="0"/><text x="600.0" y="93.0" font-size="19" font-weight="700" fill="#ECEEFA" text-anchor="middle" >Code</text><rect x="742" y="50" width="196" height="74" rx="12" fill="#3C2F2B" stroke="#F6C28B" stroke-width="2"/><text x="840.0" y="83" font-size="19" font-weight="700" fill="#ECEEFA" text-anchor="middle" >Human review</text><text x="840.0" y="106" font-size="14" font-weight="500" fill="#B4B9D6" text-anchor="middle" >accept · edit · reject</text><rect x="982" y="50" width="196" height="74" rx="12" fill="#2B2852" stroke="#B9A8F7" stroke-width="2" stroke-dasharray="0"/><text x="1080.0" y="82.0" font-size="19" font-weight="700" fill="#ECEEFA" text-anchor="middle" >Cross-modal</text><text x="1080.0" y="104.0" font-size="19" font-weight="700" fill="#ECEEFA" text-anchor="middle" >reasoning</text><rect x="22" y="210" width="196" height="74" rx="12" fill="#2B2852" stroke="#B9A8F7" stroke-width="2" stroke-dasharray="0"/><text x="120.0" y="253.0" font-size="19" font-weight="700" fill="#ECEEFA" text-anchor="middle" >Theme extraction</text><rect x="262" y="210" width="196" height="74" rx="12" fill="#3C2F2B" stroke="#F6C28B" stroke-width="2"/><text x="360.0" y="243" font-size="19" font-weight="700" fill="#ECEEFA" text-anchor="middle" >Human review</text><text x="360.0" y="266" font-size="14" font-weight="500" fill="#B4B9D6" text-anchor="middle" >accept · edit · reject</text><rect x="502" y="210" width="196" height="74" rx="12" fill="#2B2852" stroke="#B9A8F7" stroke-width="2" stroke-dasharray="0"/><text x="600.0" y="253.0" font-size="19" font-weight="700" fill="#ECEEFA" text-anchor="middle" >Validate</text><rect x="742" y="210" width="196" height="74" rx="12" fill="#2B2852" stroke="#B9A8F7" stroke-width="2" stroke-dasharray="0"/><text x="840.0" y="253.0" font-size="19" font-weight="700" fill="#ECEEFA" text-anchor="middle" >Explain</text><rect x="982" y="210" width="196" height="74" rx="37" fill="#1B3B3A" stroke="#8FE0C4" stroke-width="2" stroke-dasharray="0"/><text x="1080.0" y="253.0" font-size="19" font-weight="700" fill="#ECEEFA" text-anchor="middle" >Report</text><line x1="221" y1="87.0" x2="257" y2="87.0" stroke="#B4B9D6" stroke-width="2" marker-end="url(#ah)"/><line x1="461" y1="87.0" x2="497" y2="87.0" stroke="#B4B9D6" stroke-width="2" marker-end="url(#ah)"/><line x1="701" y1="87.0" x2="737" y2="87.0" stroke="#B4B9D6" stroke-width="2" marker-end="url(#ah)"/><line x1="941" y1="87.0" x2="977" y2="87.0" stroke="#B4B9D6" stroke-width="2" marker-end="url(#ah)"/><line x1="221" y1="247.0" x2="257" y2="247.0" stroke="#B4B9D6" stroke-width="2" marker-end="url(#ah)"/><line x1="461" y1="247.0" x2="497" y2="247.0" stroke="#B4B9D6" stroke-width="2" marker-end="url(#ah)"/><line x1="701" y1="247.0" x2="737" y2="247.0" stroke="#B4B9D6" stroke-width="2" marker-end="url(#ah)"/><line x1="941" y1="247.0" x2="977" y2="247.0" stroke="#B4B9D6" stroke-width="2" marker-end="url(#ah)"/><path d="M1080.0,126 V154 H120.0 V204" fill="none" stroke="#B4B9D6" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M810.0,48 C810.0,16 600.0,16 600.0,44" fill="none" stroke="#F6C28B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="705.0" y="18.5" font-size="14" font-weight="700" fill="#F6C28B" text-anchor="middle" >reject / edit</text><path d="M330.0,208 C330.0,176 120.0,176 120.0,204" fill="none" stroke="#F6C28B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="225.0" y="178.5" font-size="14" font-weight="700" fill="#F6C28B" text-anchor="middle" >reject / edit</text><rect x="22" y="330" width="24" height="18" rx="5" fill="#2B2852" stroke="#B9A8F7" stroke-width="2"/><text x="56" y="344" font-size="15" font-weight="600" fill="#B4B9D6" text-anchor="start" >AI agent</text><rect x="157.2" y="330" width="24" height="18" rx="5" fill="#3C2F2B" stroke="#F6C28B" stroke-width="2"/><text x="191.2" y="344" font-size="15" font-weight="600" fill="#B4B9D6" text-anchor="start" >Human checkpoint</text><rect x="359.6" y="330" width="24" height="18" rx="9" fill="#1B3B3A" stroke="#8FE0C4" stroke-width="2"/><text x="393.6" y="344" font-size="15" font-weight="600" fill="#B4B9D6" text-anchor="start" >Input / output</text><text x="1178" y="344" font-size="15" font-weight="500" fill="#B4B9D6" text-anchor="end" >Every code and theme links back to its text and image evidence.</text>
</g>
</svg>
