<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-label="Hotel Booking Status Classification: bar chart of four model accuracies and a 0.91 AUC gauge.">
<defs></defs>
<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="1" y="1" width="518" height="298" rx="16" fill="#141A27" stroke="#2B3448" stroke-width="2"/><rect x="24" y="22" width="4" height="16" rx="2" fill="#9DB0FF"/><text x="36" y="35" font-size="13" font-weight="800" fill="#9DB0FF" text-anchor="start" letter-spacing="1.4" >MACHINE LEARNING</text><text x="24" y="68" font-size="22" font-weight="700" fill="#E8ECF5" text-anchor="start" >Hotel Booking Status Classification</text><text x="24" y="94" font-size="15.5" font-weight="400" fill="#A8B1C6" text-anchor="start" >Predicts check-out, cancellation, or no-show, comparing four</text><text x="24" y="115" font-size="15.5" font-weight="400" fill="#A8B1C6" text-anchor="start" >models and K-Means on 119K records.</text><rect x="24" y="130" width="472" height="118" rx="12" fill="#222B47"/><text x="40" y="150" font-size="12.5" font-weight="700" fill="#A8B1C6" text-anchor="start" letter-spacing="1.3" >TEST ACCURACY</text><line x1="40" y1="224" x2="316" y2="224" stroke="#A8B1C6" stroke-opacity="0.5" stroke-width="1.5"/><rect x="52" y="173" width="44" height="51" rx="5" fill="#A8B1C6" fill-opacity="0.45"><animate attributeName="height" from="0" to="51" dur="1.2s" fill="freeze"/><animate attributeName="y" from="224" to="173" dur="1.2s" fill="freeze"/></rect><text x="74" y="168" font-size="13" font-weight="700" fill="#E8ECF5" text-anchor="middle" >0.82</text><text x="74" y="240" font-size="12.5" font-weight="600" fill="#A8B1C6" text-anchor="middle" >KNN</text><rect x="118" y="175" width="44" height="49" rx="5" fill="#A8B1C6" fill-opacity="0.45"><animate attributeName="height" from="0" to="49" dur="1.2s" fill="freeze"/><animate attributeName="y" from="224" to="175" dur="1.2s" fill="freeze"/></rect><text x="140" y="170" font-size="13" font-weight="700" fill="#E8ECF5" text-anchor="middle" >0.79</text><text x="140" y="240" font-size="12.5" font-weight="600" fill="#A8B1C6" text-anchor="middle" >LogReg</text><rect x="184" y="207" width="44" height="17" rx="5" fill="#A8B1C6" fill-opacity="0.45"><animate attributeName="height" from="0" to="17" dur="1.2s" fill="freeze"/><animate attributeName="y" from="224" to="207" dur="1.2s" fill="freeze"/></rect><text x="206" y="202" font-size="13" font-weight="700" fill="#E8ECF5" text-anchor="middle" >0.27</text><text x="206" y="240" font-size="12.5" font-weight="600" fill="#A8B1C6" text-anchor="middle" >NaiveB</text><rect x="250" y="172" width="44" height="52" rx="5" fill="#9DB0FF" fill-opacity="1"><animate attributeName="height" from="0" to="52" dur="1.2s" fill="freeze"/><animate attributeName="y" from="224" to="172" dur="1.2s" fill="freeze"/></rect><text x="272" y="167" font-size="13" font-weight="700" fill="#E8ECF5" text-anchor="middle" >0.83</text><text x="272" y="240" font-size="12.5" font-weight="600" fill="#A8B1C6" text-anchor="middle" >MLP</text><circle cx="414" cy="190" r="36" fill="none" stroke="#0F1420" stroke-width="9"/><circle cx="414" cy="190" r="36" fill="none" stroke="#9DB0FF" stroke-width="9" stroke-linecap="round" stroke-dasharray="226.2" stroke-dashoffset="20.4" transform="rotate(-90 414 190)"><animate attributeName="stroke-dashoffset" from="226.2" to="20.4" dur="1.6s" fill="freeze"/></circle><text x="414" y="193" font-size="22" font-weight="800" fill="#E8ECF5" text-anchor="middle" >0.91</text><text x="414" y="210" font-size="11.5" font-weight="700" fill="#A8B1C6" text-anchor="middle" letter-spacing="1" >AUC</text><text x="414" y="240" font-size="13" font-weight="600" fill="#E8ECF5" text-anchor="middle" >119K bookings</text><rect x="24" y="266" width="69" height="26" rx="7" fill="#0F1420" stroke="#2B3448" stroke-width="1.3"/><text x="59" y="284" font-size="14" font-weight="600" fill="#E8ECF5" text-anchor="middle" >Python</text><rect x="101" y="266" width="116" height="26" rx="7" fill="#0F1420" stroke="#2B3448" stroke-width="1.3"/><text x="159" y="284" font-size="14" font-weight="600" fill="#E8ECF5" text-anchor="middle" >