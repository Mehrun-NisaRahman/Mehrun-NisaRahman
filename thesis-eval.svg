<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="How the thesis will be evaluated: fair baselines, agreement with human coders, explainability and usability, and ablations with ethics.">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B8E0FF"/><stop offset="0.35" stop-color="#C7B8F5"/><stop offset="0.7" stop-color="#F9B8D6"/><stop offset="1" stop-color="#B5EAD7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#8b7fc7" flood-opacity="0.22"/></filter>
    
  </defs>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif"><g filter="url(#shadow)"><rect x="12" y="10" width="276" height="162" rx="20" fill="#fff"/></g><rect x="12" y="10" width="276" height="162" rx="20" fill="#C7B8F5" fill-opacity="0.2" stroke="#C7B8F5" stroke-width="3"/><circle cx="52" cy="50" r="22" fill="#C7B8F5"/><g transform="translate(52,50) scale(1.25)"><g stroke="#7c6be0" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M0,-8V8M-8,8H8M-9,-4H9"/><path d="M-9,-4L-12,3H-6Z M9,-4L6,3H12Z"/></g></g><text x="86" y="57" font-size="18" font-weight="800" fill="#3B2F63">Fair baselines</text><text x="34" y="100" font-size="14" fill="#475569">Single-agent VLM with the same</text><text x="34" y="120" font-size="14" fill="#475569">token budget, plus a classical ML</text><text x="34" y="140" font-size="14" fill="#475569">baseline on CLIP features.</text><g filter="url(#shadow)"><rect x="312" y="10" width="276" height="162" rx="20" fill="#fff"/></g><rect x="312" y="10" width="276" height="162" rx="20" fill="#B8E0FF" fill-opacity="0.2" stroke="#B8E0FF" stroke-width="3"/><circle cx="352" cy="50" r="22" fill="#B8E0FF"/><g transform="translate(352,50) scale(1.25)"><g fill="#3b8fd9" fill-opacity="0.35" stroke="#3b8fd9" stroke-width="1.6"><circle cx="-4" cy="0" r="6.5"/><circle cx="4" cy="0" r="6.5"/></g></g><text x="386" y="57" font-size="18" font-weight="800" fill="#3B2F63">Agreement</text><text x="334" y="100" font-size="14" fill="#475569">Cohen's κ, Krippendorff's α, and</text><text x="334" y="120" font-size="14" fill="#475569">F1-score against human coders.</text><g filter="url(#shadow)"><rect x="612" y="10" width="276" height="162" rx="20" fill="#fff"/></g><rect x="612" y="10" width="276" height="162" rx="20" fill="#B5EAD7" fill-opacity="0.2" stroke="#B5EAD7" stroke-width="3"/><circle cx="652" cy="50" r="22" fill="#B5EAD7"/><g transform="translate(652,50) scale(1.25)"><g fill="none" stroke="#2fa37a" stroke-width="2" stroke-linecap="round"><circle cx="-2" cy="-2" r="6"/><path d="M3,3L8,8"/></g></g><text x="686" y="57" font-size="18" font-weight="800" fill="#3B2F63">Explainability</text><text x="634" y="100" font-size="14" fill="#475569">Expert-rated explanations, plus</text><text x="634" y="120" font-size="14" fill="#475569">runtime, token cost, and</text><text x="634" y="140" font-size="14" fill="#475569">usability (SUS).</text><g filter="url(#shadow)"><rect x="912" y="10" width="276" height="162" rx="20" fill="#fff"/></g><rect x="912" y="10" width="276" height="162" rx="20" fill="#F9B8D6" fill-opacity="0.2" stroke="#F9B8D6" stroke-width="3"/><circle cx="952" cy="50" r="22" fill="#F9B8D6"/><g transform="translate(952,50) scale(1.25)"><path d="M0,-9 L8,-6 V1 C8,6 4,8 0,10 C-4,8 -8,6 -8,1 V-6 Z" fill="none" stroke="#d9559b" stroke-width="1.8" stroke-linejoin="round"/></g><text x="986" y="57" font-size="18" font-weight="800" fill="#3B2F63">Ablations &amp; ethics</text><text x="934" y="100" font-size="14" fill="#475569">Which parts really help, plus</text><text x="934" y="120" font-size="14" fill="#475569">bias, accountability, and over-</text><text x="934" y="140" font-size="14" fill="#475569">trust in AI.</text>
  </g>
</svg>
