<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Mehrun-Nisa Rahman. Human-in-the-loop, multi-agent, vision-language.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a1f4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>
  <circle cx="930" cy="160" r="190" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accent)"/>

  <!-- Left: text -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="140" font-size="54" font-weight="700" fill="#ffffff">Mehrun-Nisa Rahman</text>
    <text x="60" y="184" font-size="22" fill="#a5b4fc">CS student · AI &amp; software engineering</text>
    <text x="60" y="214" font-size="15" fill="#94a3b8">B.Sc. thesis: multimodal qualitative coding with AI agents</text>

    <g font-size="14" font-weight="600">
      <rect x="60" y="242" width="164" height="34" rx="17" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.6"/>
      <text x="142" y="264" text-anchor="middle" fill="#67e8f9">Human-in-the-Loop</text>
      <rect x="236" y="242" width="116" height="34" rx="17" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="294" y="264" text-anchor="middle" fill="#c4b5fd">Multi-Agent</text>
      <rect x="364" y="242" width="146" height="34" rx="17" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.6"/>
      <text x="437" y="264" text-anchor="middle" fill="#67e8f9">Vision-Language</text>
    </g>
  </g>

  <!-- Right: agent network -->
  <g>
    <!-- ring links -->
    <path d="M930,60 L1016.6,110 L1016.6,210 L930,260 L843.4,210 L843.4,110 Z" fill="none" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.5"/>
    <!-- spokes -->
    <g stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.2">
      <line x1="930" y1="160" x2="930" y2="60"/>
      <line x1="930" y1="160" x2="1016.6" y2="110"/>
      <line x1="930" y1="160" x2="1016.6" y2="210"/>
      <line x1="930" y1="160" x2="930" y2="260"/>
      <line x1="930" y1="160" x2="843.4" y2="210"/>
      <line x1="930" y1="160" x2="843.4" y2="110"/>
    </g>
    <!-- human feedback loop -->
    <g fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 5" stroke-opacity="0.9">
      <path d="M1016.6,110 Q1075,110 1098,146"/>
      <path d="M1098,174 Q1075,210 1016.6,210"/>
    </g>

    <!-- pulses -->
    <circle r="4" fill="#67e8f9">
      <animateMotion dur="7s" repeatCount="indefinite" path="M930,60 L1016.6,110 L1016.6,210 L930,260 L843.4,210 L843.4,110 Z"/>
    </circle>
    <circle r="3.5" fill="#c4b5fd">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M930,160 L930,60"/>
    </circle>
    <circle r="3.5" fill="#c4b5fd">
      <animateMotion dur="3.2s" begin="1.1s" repeatCount="indefinite" path="M930,160 L1016.6,210"/>
    </circle>
    <circle r="3.5" fill="#c4b5fd">
      <animateMotion dur="3.2s" begin="2.1s" repeatCount="indefinite" path="M930,160 L843.4,210"/>
    </circle>
    <circle r="3.5" fill="#fbbf24">
      <animateMotion dur="4s" repeatCount="indefinite" path="M1016.6,110 Q1075,110 1098,146"/>
    </circle>

    <!-- agent nodes -->
    <g fill="#0b1020" stroke-width="2">
      <circle cx="930" cy="60" r="14" stroke="#22d3ee"/>
      <circle cx="1016.6" cy="110" r="14" stroke="#a78bfa"/>
      <circle cx="1016.6" cy="210" r="14" stroke="#22d3ee"/>
      <circle cx="930" cy="260" r="14" stroke="#a78bfa"/>
      <circle cx="843.4" cy="210" r="14" stroke="#22d3ee"/>
      <circle cx="843.4" cy="110" r="14" stroke="#a78bfa"/>
    </g>
    <g fill="#22d3ee">
      <circle cx="930" cy="60" r="4"/>
      <circle cx="1016.6" cy="210" r="4"/>
      <circle cx="843.4" cy="210" r="4"/>
    </g>
    <g fill="#a78bfa">
      <circle cx="1016.6" cy="110" r="4"/>
      <circle cx="930" cy="260" r="4"/>
      <circle cx="843.4" cy="110" r="4"/>
    </g>

    <!-- agent labels -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#cbd5e1">
      <text x="930" y="38" text-anchor="middle">Preprocess</text>
      <text x="1036" y="92">Code</text>
      <text x="1036" y="236">Link</text>
      <text x="930" y="288" text-anchor="middle">Themes</text>
      <text x="824" y="236" text-anchor="end">Validate</text>
      <text x="824" y="92" text-anchor="end">Explain</text>
    </g>

    <!-- center: vision (eye) -->
    <circle cx="930" cy="160" r="28" fill="#0b1020" stroke="url(#accent)" stroke-width="2.5"/>
    <g transform="translate(930,160)">
      <path d="M-15,0 Q0,-13 15,0 Q0,13 -15,0 Z" fill="none" stroke="#e0f2fe" stroke-width="1.8"/>
      <circle r="4.5" fill="#22d3ee"/>
      <circle r="1.8" fill="#0b1020"/>
    </g>

    <!-- human node -->
    <circle cx="1110" cy="160" r="22" fill="#0b1020" stroke="#f59e0b" stroke-width="2.5"/>
    <g transform="translate(1110,160)" fill="#fbbf24">
      <circle cx="0" cy="-5" r="5"/>
      <path d="M-9,10 Q-9,2 0,2 Q9,2 9,10 Z"/>
    </g>
    <text x="1110" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fbbf24">Human review</text>
  </g>
</svg>
