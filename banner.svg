<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Mehrun-Nisa Rahman. Databases, AI, graphics and software engineering projects leading to a human-in-the-loop multi-agent vision-language thesis.">
