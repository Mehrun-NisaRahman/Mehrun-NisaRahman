<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 186" width="1200" height="186" role="img" aria-label="How the thesis will be evaluated: fair baselines, agreement with human coders, explainability and usability, and ablations with ethics.">
<defs></defs>
<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="24" y="6" width="270" height="170" rx="14" fill="#141A27" stroke="#2B3448" stroke-width="1.5"/><rect x="44" y="26" width="44" height="44" rx="11" fill="#222B47"/><g transform="translate(66,48) scale(1.2)"><g stroke="#9DB0FF" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M0,-8V8M-8,8H8M-9,-4H9"/><path d="M-9,-4L-12,3H-6Z M9,-4L6,3H12Z"/></g></g><text x="102" y="56" font-size="19" font-weight="700" fill="#E8ECF5" text-anchor="start" >Fair baselines</text><text x="44" y="102" font-size="15.5" font-weight="400" fill="#A8B1C6" text-anchor="start" >Single-agent VLM at the same</text><text x="44" y="125" font-size="15.5" font-weight="400" fill="#A8B1C6" text-anchor="start" >token budget, plus a CLIP-</text><text x="44" y="148" font-size="15.5" font-weight="400" fill="#A8B1C6" text-anchor="start" >feature ML baseline.</text><rect x="318" y="6" width="270" height="170" rx="14" fill="#141A27" stroke="#2B3448" stroke-width="1.5"/><rect x="338" y="26" width="44" height="44" rx="11" fill="#163430"/><g transform="translate(360,48) scale(1.2)"><g fill="#5FD3C8" fill-opacity="0.35" stroke="#5FD3C8" stroke-width="1.6"><circle cx="-4" cy="0" r="6.5"/><circle cx="4" cy="0" r="6.5"/></g></g><text x="396" y="56" font-size="19" font-weight="700" fill="#E8ECF5" text-anchor="start" >Agreement</text><text x="338" y="102" font-size="15.5" font-weight="400" fill="#A8B1C6" text-anchor="start" >Cohen&#x27;s κ, Krippendorff&#x27;s α,</text><text x="338" y="125" font-size="15.5" font-weight="400" fill="#A8B1C6" text-anchor="start" >and F1-score against human</text><text x="338" y="148" font-size="15.5" font-weight="400" fill="#A8B1C6" text-anchor="start" >coders.</text><rect x="612" y="6" width="270" height="170" rx="14" fill="#141A27" stroke="#2B3448" stroke-width="1.5"/><rect x="632" y="26" width="44" height="44" rx="11" fill="#222B47"/><g transform="translate(654,48) scale(1.2)"><g fill="none" stroke="#9DB0FF" stroke-width="2" stroke-linecap="round"><circle cx="-2" cy="-2" r="6"/><path d="M3,3L8,8"/></g></g><text x="690" y="56" font-size="19" font-weight="700" fill="#E8ECF5" text-anchor="start" >Explainability</text><text x="632" y="102" font-size="15.5" font-weight="400" fill="#A8B1C6" text-anchor="start" >Expert-rated explanations,</text><text x="632" y="125" font-size="15.5" font-weight="400" fill="#A8B1C6" text-anchor="start" >plus runtime, token cost, and</text><text x="632" y="148" font-size="15.5" font-weight="400" fill="#A8B1C6" text-anchor="start" >usability (SUS).</text><rect x="906" y="6" width="270" height="170" rx="14" fill="#141A27" stroke="#2B3448" stroke-width="1.5"/><rect x="926" y="26" width="44" height="44" rx="11" fill="#163430"/><g transform="translate(948,48) scale(1.2)"><path d="M0,-9 L8,-6 V1 C8,6 4,8 0,10 C-4,8 -8,6 -8,1 V-6 Z" fill="none" stroke="#5FD3C8" stroke-width="1.8" stroke-linejoin="round"/></g><text x="984" y="56" font-size="19" font-weight="700" fill="#E8ECF5" text-anchor="start" >Ablations &amp; ethics</text><text x="926" y="102" font-size="15.5" font-weight="400" fill="#A8B1C6" text-anchor="start" >Which parts really help, plus</text><text x="926" y="125" font-size="15.5" font-weight="400" fill="#A8B1C6" text-anchor="start" >bias, accountability, and</text><text x="926" y="148" font-size="15.5" font-weight="400" fill="#A8B1C6" text-anchor="start" >over-trust in AI.</text>
</g>
</svg>
