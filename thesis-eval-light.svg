<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 186" width="1200" height="186" role="img" aria-label="How the thesis will be evaluated: fair baselines, agreement with human coders, explainability and usability, and ablations with ethics.">
<defs></defs>
<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="24" y="6" width="270" height="170" rx="14" fill="#F6F3FF" stroke="#D9D2F2" stroke-width="1.5"/><rect x="44" y="26" width="44" height="44" rx="11" fill="#E7E1FB"/><g transform="translate(66,48) scale(1.2)"><g stroke="#5B4BC4" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M0,-8V8M-8,8H8M-9,-4H9"/><path d="M-9,-4L-12,3H-6Z M9,-4L6,3H12Z"/></g></g><text x="102" y="56" font-size="18" font-weight="700" fill="#26213F" text-anchor="start" >Fair comparison</text><text x="44" y="102" font-size="15.5" font-weight="400" fill="#4F4A6E" text-anchor="start" >Tested against a single AI</text><text x="44" y="125" font-size="15.5" font-weight="400" fill="#4F4A6E" text-anchor="start" >model with the same budget,</text><text x="44" y="148" font-size="15.5" font-weight="400" fill="#4F4A6E" text-anchor="start" >plus a simple baseline.</text><rect x="318" y="6" width="270" height="170" rx="14" fill="#F6F3FF" stroke="#D9D2F2" stroke-width="1.5"/><rect x="338" y="26" width="44" height="44" rx="11" fill="#D8F3EA"/><g transform="translate(360,48) scale(1.2)"><g fill="#1F7A63" fill-opacity="0.35" stroke="#1F7A63" stroke-width="1.6"><circle cx="-4" cy="0" r="6.5"/><circle cx="4" cy="0" r="6.5"/></g></g><text x="396" y="56" font-size="18" font-weight="700" fill="#26213F" text-anchor="start" >Agrees with humans</text><text x="338" y="102" font-size="15.5" font-weight="400" fill="#4F4A6E" text-anchor="start" >Scored against human coders</text><text x="338" y="125" font-size="15.5" font-weight="400" fill="#4F4A6E" text-anchor="start" >with Cohen&#x27;s κ,</text><text x="338" y="148" font-size="15.5" font-weight="400" fill="#4F4A6E" text-anchor="start" >Krippendorff&#x27;s α and F1.</text><rect x="612" y="6" width="270" height="170" rx="14" fill="#F6F3FF" stroke="#D9D2F2" stroke-width="1.5"/><rect x="632" y="26" width="44" height="44" rx="11" fill="#FCE8D2"/><g transform="translate(654,48) scale(1.2)"><g fill="none" stroke="#9A5B12" stroke-width="2" stroke-linecap="round"><circle cx="-2" cy="-2" r="6"/><path d="M3,3L8,8"/></g></g><text x="690" y="56" font-size="18" font-weight="700" fill="#26213F" text-anchor="start" >Clear explanations</text><text x="632" y="102" font-size="15.5" font-weight="400" fill="#4F4A6E" text-anchor="start" >Experts rate the</text><text x="632" y="125" font-size="15.5" font-weight="400" fill="#4F4A6E" text-anchor="start" >explanations. Speed, cost and</text><text x="632" y="148" font-size="15.5" font-weight="400" fill="#4F4A6E" text-anchor="start" >usability (SUS) are measured.</text><rect x="906" y="6" width="270" height="170" rx="14" fill="#F6F3FF" stroke="#D9D2F2" stroke-width="1.5"/><rect x="926" y="26" width="44" height="44" rx="11" fill="#E7E1FB"/><g transform="translate(948,48) scale(1.2)"><path d="M0,-9 L8,-6 V1 C8,6 4,8 0,10 C-4,8 -8,6 -8,1 V-6 Z" fill="none" stroke="#5B4BC4" stroke-width="1.8" stroke-linejoin="round"/></g><text x="984" y="56" font-size="18" font-weight="700" fill="#26213F" text-anchor="start" >Ethics &amp; ablations</text><text x="926" y="102" font-size="15.5" font-weight="400" fill="#4F4A6E" text-anchor="start" >Test which parts matter.</text><text x="926" y="125" font-size="15.5" font-weight="400" fill="#4F4A6E" text-anchor="start" >Check for bias and over-trust</text><text x="926" y="148" font-size="15.5" font-weight="400" fill="#4F4A6E" text-anchor="start" >in AI.</text>
</g>
</svg>
