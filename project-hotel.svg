<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Hotel Booking Status Classification: bar chart of four model accuracies and a 0.91 AUC gauge.">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B8E0FF"/><stop offset="0.35" stop-color="#C7B8F5"/><stop offset="0.7" stop-color="#F9B8D6"/><stop offset="1" stop-color="#B5EAD7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#8b7fc7" flood-opacity="0.22"/></filter>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#C7B8F5" stop-opacity="0.35"/></linearGradient>
  </defs>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <g filter="url(#shadow)"><rect x="6" y="4" width="588" height="326" rx="26" fill="url(#cbg)"/></g>
    <rect x="6" y="4" width="588" height="326" rx="26" fill="none" stroke="#C7B8F5" stroke-width="3"/><rect x="28" y="24" width="164" height="26" rx="13" fill="#C7B8F5"/><text x="110" y="41.5" text-anchor="middle" font-size="12" font-weight="800" fill="#7c6be0" letter-spacing="1.2">MACHINE LEARNING</text><text x="28" y="84" font-size="24" font-weight="800" fill="#3B2F63">Hotel Booking Status Classification</text><text x="28" y="110" font-size="14" fill="#475569">Predicts whether a booking ends in check-out, cancellation, or no-</text><text x="28" y="130" font-size="14" fill="#475569">show, and compares 4 models plus K-Means on 119K records.</text><rect x="28" y="148" width="544" height="136" rx="18" fill="#C7B8F5" fill-opacity="0.38"/><text x="58" y="166" font-size="11" font-weight="700" fill="#475569" letter-spacing="1.2">TEST ACCURACY</text><line x1="46" y1="262" x2="362" y2="262" stroke="#3B2F63" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/><rect x="58" y="190" width="52" height="72" rx="8" fill="#C7B8F5"><animate attributeName="height" from="0" to="72" dur="1.1s" begin="0.0s" fill="freeze"/><animate attributeName="y" from="262" to="190" dur="1.1s" begin="0.0s" fill="freeze"/></rect><text x="84" y="184" text-anchor="middle" font-size="12" font-weight="800" fill="#3B2F63">0.82</text><text x="84" y="278" text-anchor="middle" font-size="11" fill="#475569">KNN</text><rect x="136" y="193" width="52" height="69" rx="8" fill="#C7B8F5"><animate attributeName="height" from="0" to="69" dur="1.1s" begin="0.15s" fill="freeze"/><animate attributeName="y" from="262" to="193" dur="1.1s" begin="0.15s" fill="freeze"/></rect><text x="162" y="187" text-anchor="middle" font-size="12" font-weight="800" fill="#3B2F63">0.79</text><text x="162" y="278" text-anchor="middle" font-size="11" fill="#475569">LogReg</text><rect x="214" y="238" width="52" height="24" rx="8" fill="#FFD3B0"><animate attributeName="height" from="0" to="24" dur="1.1s" begin="0.3s" fill="freeze"/><animate attributeName="y" from="262" to="238" dur="1.1s" begin="0.3s" fill="freeze"/></rect><text x="240" y="232" text-anchor="middle" font-size="12" font-weight="800" fill="#3B2F63">0.27</text><text x="240" y="278" text-anchor="middle" font-size="11" fill="#475569">NaiveB</text><rect x="292" y="189" width="52" height="73" rx="8" fill="#7c6be0"><animate attributeName="height" from="0" to="73" dur="1.1s" begin="0.44999999999999996s" fill="freeze"/><animate attributeName="y" from="262" to="189" dur="1.1s" begin="0.44999999999999996s" fill="freeze"/></rect><text x="318" y="183" text-anchor="middle" font-size="12" font-weight="800" fill="#3B2F63">0.83</text><text x="318" y="278" text-anchor="middle" font-size="11" fill="#475569">NeuralNet</text><path d="M0,-9 L2.6,-3 L9,-2.6 L4,1.5 L5.8,8 L0,4.4 L-5.8,8 L-4,1.5 L-9,-2.6 L-2.6,-3 Z" fill="#e08a3c" transform="translate(318,165) scale(0.9)"/><circle cx="470" cy="208" r="40" fill="#fff" fill-opacity="0.7" stroke="#fff" stroke-width="10"/><circle cx="470" cy="208" r="40" fill="none" stroke="#7c6be0" stroke-width="10" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="22.6" transform="rotate(-90 470 208)"><animate attributeName="stroke-dashoffset" from="251.3" to="22.6" dur="1.6s" fill="freeze"/></circle><text x="470" y="213" text-anchor="middle" font-size="22" font-weight="800" fill="#3B2F63">0.91</text><text x="470" y="229" text-anchor="middle" font-size="11" font-weight="700" fill="#475569" letter-spacing="1">AUC</text><text x="470" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#3B2F63">119K bookings</text><rect x="28" y="298" width="68" height="26" rx="13" fill="#fff" stroke="#C7B8F5" stroke-width="2"/><text x="62.2" y="315.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c6be0">Python</text><rect x="104.4" y="298" width="113" height="26" rx="13" fill="#fff" stroke="#C7B8F5" stroke-width="2"/><text x="160.8" y="315.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c6be0">scikit-learn</text><rect x="225.20000000000002" y="298" width="68" height="26" rx="13" fill="#fff" stroke="#C7B8F5" stroke-width="2"/><text x="259.4" y="315.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c6be0">pandas</text><rect x="452" y="298" width="120" height="26" rx="13" fill="#7c6be0"/><text x="512" y="315.5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">View repo →</text>
  </g>
</svg>
